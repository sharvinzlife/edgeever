<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 432" role="img" aria-labelledby="edgeever-og-title edgeever-og-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="edgeever-og-title">EdgeEver share-link preview pipeline</title>
  <desc id="edgeever-og-desc">A social crawler requests a share link; the self-hosted Bun server looks the share up through the internal EdgeEver API, picks a cover from the images already in the note, injects Open Graph meta into the page shell and returns it; the crawler then fetches that cover from the note's own public blob URL.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- paper -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zone (painted first) -->
  <rect x="160" y="64" width="672" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="176" y="68" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text x="214" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARE RENDER</text>

  <!-- arrows (before boxes) -->
  <!-- pipeline row, y=136 -->
  <line x1="144" y1="136" x2="176" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="304" y1="136" x2="336" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="136" x2="512" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="656" y1="136" x2="688" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- cover -> image: the url the picker emits (accent, focal relationship) -->
  <line x1="560" y1="176" x2="560" y2="288" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="568" y="228" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="600" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OG:IMAGE</text>

  <!-- crawler -> image: the second request, unauthenticated (external) -->
  <path d="M 88,176 V 320 Q 88,328 96,328 H 512" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="96" y="256" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="140" y="265" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH COVER</text>

  <!-- page -> crawler: the html comes back (return, dashed) -->
  <path d="M 752,96 V 56 Q 752,48 744,48 H 104 Q 96,48 96,56 V 96" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="428" y="28" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="468" y="37" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETURN</text>

  <!-- nodes: mask, box, tag, name, sublabel -->
  <!-- N1 crawler (input) -->
  <rect x="32" y="96" width="112" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="96" width="112" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="40" y="102" width="48" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="64" y="111" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRAWLER</text>
  <text x="88" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WhatsApp</text>
  <text x="88" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /share/&lt;token&gt;</text>

  <!-- N2 share route (backend) -->
  <rect x="176" y="96" width="128" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="176" y="96" width="128" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="184" y="102" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="204" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
  <text x="240" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Share route</text>
  <text x="240" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bun.serve</text>

  <!-- N3 share lookup (backend) -->
  <rect x="336" y="96" width="144" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="336" y="96" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="344" y="102" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="364" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FETCH</text>
  <text x="408" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Share lookup</text>
  <text x="408" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EdgeEver API</text>

  <!-- N4 cover picker (focal) -->
  <rect x="512" y="96" width="144" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="512" y="96" width="144" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="520" y="102" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text x="542" y="111" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PICKER</text>
  <text x="584" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cover picker</text>
  <text x="584" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cover: tag · raster</text>

  <!-- N5 share page (backend) -->
  <rect x="688" y="96" width="128" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="688" y="96" width="128" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="696" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="710" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OG</text>
  <text x="752" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Share page</text>
  <text x="752" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">injectMeta</text>

  <!-- N6 the note's own image (store) -->
  <rect x="512" y="288" width="144" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="512" y="288" width="144" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="520" y="294" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="538" y="303" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BLOB</text>
  <text x="584" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Note's own image</text>
  <text x="584" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">res_&lt;id&gt; · public</text>

  <!-- legend strip -->
  <line x1="32" y1="392" x2="928" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="112" y1="404" x2="140" y2="404" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="148" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INTERNAL CALL</text>
  <line x1="280" y1="404" x2="308" y2="404" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="316" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COVER CHOICE · FOCAL</text>
  <line x1="520" y1="404" x2="548" y2="404" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="556" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNAL FETCH</text>
  <line x1="712" y1="404" x2="740" y2="404" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="748" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>
</svg>
